name: devops_engineer_onboarding
version: "1.0"

description: Onboarding workflow for DevOps Engineers.

trigger:
  department: Engineering
  job_title: DevOps Engineer

tasks:

  - id: welcome_email
    name: Send welcome email
    type: notification

  - id: company_account
    name: Create company account
    type: provisioning
    depends_on:
      - welcome_email

  - id: slack_access
    name: Provision Slack access
    type: provisioning
    depends_on:
      - company_account

  - id: github_access
    name: Provision GitHub access
    type: provisioning
    depends_on:
      - company_account

  - id: security_training
    name: Complete security training
    type: employee_task
    depends_on:
      - company_account

  - id: vpn_access
    name: Provision VPN access
    type: provisioning
    requires_approval: true
    approval_role: manager
    depends_on:
      - security_training

  - id: cloud_environment
    name: Provision cloud environment
    type: provisioning
    requires_approval: true
    approval_role: manager
    depends_on:
      - security_training

  - id: infrastructure_access
    name: Provision infrastructure access
    type: provisioning
    requires_approval: true
    approval_role: manager
    depends_on:
      - cloud_environment

  - id: deployment_access
    name: Provision deployment access
    type: provisioning
    requires_approval: true
    approval_role: manager
    depends_on:
      - infrastructure_access

  - id: manager_1on1
    name: Schedule manager 1:1
    type: scheduling
    depends_on:
      - company_account