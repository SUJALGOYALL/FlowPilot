name: frontend_engineer_onboarding
version: "1.0"

description: Onboarding workflow for Frontend Engineers.

trigger:
  department: Engineering
  job_title: Frontend Engineer

tasks:

  - id: welcome_email
    name: Send welcome email
    type: notification

  - id: company_account
    name: Create company account
    type: provisioning
    depends_on:
      - welcome_email

  - id: slack_access
    name: Provision Slack access
    type: provisioning
    depends_on:
      - company_account

  - id: github_access
    name: Provision GitHub access
    type: provisioning
    depends_on:
      - company_account

  - id: security_training
    name: Complete security training
    type: employee_task
    depends_on:
      - company_account

  - id: vpn_access
    name: Provision VPN access
    type: provisioning
    requires_approval: true
    approval_role: manager
    depends_on:
      - security_training

  - id: frontend_environment
    name: Provision frontend development environment
    type: provisioning
    depends_on:
      - github_access

  - id: package_registry
    name: Provision package registry access
    type: provisioning
    depends_on:
      - frontend_environment

  - id: manager_1on1
    name: Schedule manager 1:1
    type: scheduling
    depends_on:
      - company_account